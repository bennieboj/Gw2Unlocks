name: 3_Unlock_Classifier

on:
  workflow_run:
    workflows: ["2_Wiki_Processing"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute branch
        run: |
          export TZ=Europe/Brussels
          echo "BRANCH=daily/$(date +%F)" >> $GITHUB_ENV

      - name: Checkout branch
        run: |
          git fetch origin
          git checkout $BRANCH

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/UnlockClassifier/Gw2Unlocks.UnlockClassifier.Host

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Unlock Classifier update"
          git push origin HEAD