name: 4_Website_Generator

on:
  workflow_run:
    workflows: ["3_Unlock_Classifier"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute branch
        run: |
          export TZ=Europe/Brussels
          echo "BRANCH=daily/$(date +%F)" >> $GITHUB_ENV

      - name: Checkout branch
        run: |
          git fetch origin
          # git checkout $BRANCH
          git checkout master

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/Gw2Unlocks.Website
      
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy wwwroot --project-name=gw2unlocks

