name: 4_Website_Generator

# Two reasons to run, doing different things. On a pull request this is the gate: it builds the
# site against the classified data and reports pass or fail, and branch protection is configured to
# require it, so a classification the site cannot generate cannot be merged. On a push to main it
# publishes.
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-site
  cancel-in-progress: false

jobs:
  # The name of this job is the name of the status check, so it is what you pick as the required
  # check on main. It is deliberately not called "run".
  build_site:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/Gw2Unlocks.Website

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/Gw2Unlocks.Website

      # Only a push to main publishes, so unreviewed data cannot reach the site. A pull request run
      # builds the site and stops there.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy wwwroot --project-name=gw2unlocks
          workingDirectory: "src/Gw2Unlocks/Gw2Unlocks.Website"
