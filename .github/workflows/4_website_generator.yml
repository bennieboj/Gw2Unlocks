name: 4_Website_Generator

on:
  push:
    branches:
      - main
      
  workflow_run:
    workflows: ["3_Unlock_Classifier"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-pipeline
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Triggered by the classifier, this generates the site from the automated branch so a broken
      # build is caught before the pull request is opened. Triggered by a push to main, it uses
      # the merged result and publishes it.
      - name: Checkout automated branch
        if: github.event_name == 'workflow_run'
        uses: ./.github/actions/checkout-automated-branch

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/Gw2Unlocks.Website

      # Only a merge into main publishes. An automated run validates that the site builds; it must
      # not put unreviewed data in front of users.
      - name: Publish to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy wwwroot --project-name=gw2unlocks
          workingDirectory: "src/Gw2Unlocks/Gw2Unlocks.Website"