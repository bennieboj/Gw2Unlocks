name: 2_Wiki_Processing

on:
  workflow_run:
    workflows: ["1_Cache_Updater"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-pipeline
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout automated branch
        id: branch
        uses: ./.github/actions/checkout-automated-branch

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/WikiProcessing/Gw2Unlocks.WikiProcessing.Host

      - name: Commit changes
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Wiki Processing update"
          # Explicit refspec: this push names its target, so it cannot land on the checked out
          # branch by accident.
          git push origin "HEAD:refs/heads/$BRANCH"