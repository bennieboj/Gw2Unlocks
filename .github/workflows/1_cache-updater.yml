name: 1_Cache_Updater

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is always UTC: 03:00 UTC is 04:00 in Brussels during winter and 05:00 in summer.
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: automated-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout automated branch
        id: branch
        uses: ./.github/actions/checkout-automated-branch
        with:
          create: 'true'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --no-launch-profile --project src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host
      
      - name: Commit changes
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Cache Updater update"
          # Explicit refspec: this push names its target, so it cannot land on the checked out
          # branch by accident.
          git push origin "HEAD:refs/heads/$BRANCH"