      #   never downloaded  -> restore did not resolve the package at all
      #   in assets, absent  -> restore resolved it, but the build did not copy the RID asset out
      #   present            -> the loader cannot see it for some other reason
      #
      # project.assets.json is the restore graph, so it distinguishes the first two directly.
      #
      # Kept rather than deleted because it is the only thing that answers those three questions
      # directly. If the sprite sheet step fails with DllNotFoundException again, re-enable this
      # instead of inferring the cause from the loader message.
      #- name: Diagnose native assets
      #  run: |
      #    dir=src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host/bin/Release/net10.0/linux-x64
