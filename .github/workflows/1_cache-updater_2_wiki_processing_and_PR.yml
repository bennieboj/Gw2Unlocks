name: 1_Cache_Updater_2_Wiki_Processing_and_PR

# The three things that used to be separate workflows: fetch the game data, process the wiki dump,
# and open a pull request for the result. They are three jobs here because they are one pipeline
# with nothing to decide in between, and a failure in any of them should stop the next.
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is always UTC: 03:00 UTC is 04:00 in Brussels during winter and 05:00 in summer.
    - cron: '0 3 * * *'

permissions:
  contents: write
  pull-requests: write

# One refresh at a time. Without this, a manual run during the nightly one would fight it over
# the same branch.
concurrency:
  group: automated-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `automated` holds the pending changes. It is created from main when it is missing, which is
      # the normal case after a merge, and joined when it already exists so that a night nobody had
      # time to review is not thrown away. The push names its own target, so the checkout above
      # being on main cannot make this write to main.
      - name: Join or create the automated branch
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/automated; then
            git checkout -B automated origin/automated
            echo "Continuing the existing automated branch."
          else
            git checkout -b automated origin/main
            echo "Created automated from main."
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Published rather than `dotnet run` because the icon sprite sheets need the native SkiaSharp
      # library. A plain `dotnet run` builds without a runtime identifier, which leaves the native
      # asset under runtimes/<rid>/native/ instead of next to the app, and the loader fails with
      # DllNotFoundException for libSkiaSharp. Publishing with an explicit RID places the .so in the
      # application directory, which is where the P/Invoke probe looks first.
      #
      # The output stays inside the repository on purpose: CachePaths walks up from the executable to
      # find Directory.Build.props and throws if it does not, so publishing to the runner temp
      # directory would break cache path resolution.
      - name: Publish the cache updater
        run: |
          dotnet publish src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host/publish

      # Reports where the native SkiaSharp library went missing, then fails if it is not next to the
      # app. The two questions are deliberately separate, because the answer differs by cause:
      #
      #   never downloaded  -> restore did not resolve the package at all
      #   in assets, absent  -> restore resolved it, but publish did not copy the RID asset out
      #   present            -> the loader cannot see it for some other reason
      #
      # project.assets.json is the restore graph, so it distinguishes the first two directly.
      - name: Diagnose native assets
        run: |
          dir=src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host/publish
          assets=src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host/obj/project.assets.json

          echo "### SkiaSharp packages in the NuGet cache"
          ls ~/.nuget/packages/ 2>/dev/null | grep -i skiasharp || echo "(none downloaded)"

          echo
          echo "### SkiaSharp native assets in the restore graph"
          if [ -f "$assets" ]; then
            # Match only package ids. A loose pattern also matches the libSkiaSharp.so file names
            # inside the assets file, which are evidence of the asset, not of a resolved package.
            grep -o '"SkiaSharp[A-Za-z.]*/[0-9][^"]*"' "$assets" | tr -d '"' | sort -u | sed 's/^/  package: /'
            echo "  --- native asset entries ---"
            grep -o '"libSkiaSharp[^"]*"' "$assets" | sort -u | sed 's/^/  asset:   /' || echo "  (no native asset entries)"
          else
            echo "  project.assets.json not found at $assets"
          fi

          echo
          echo "### Native libraries in the publish output"
          find "$dir" -name '*.so' 2>/dev/null | sed 's/^/  /' || true
          [ -d "$dir/runtimes" ] && echo "  (runtimes/ present)" || echo "  (no runtimes/ directory)"

          echo
          if [ -f "$dir/libSkiaSharp.so" ]; then
            echo "libSkiaSharp.so present in the application directory."
          else
            echo "::error::libSkiaSharp.so is missing from $dir; the sprite sheet step will fail."
            echo "--- full listing ---"
            ls -la "$dir" || true
            exit 1
          fi

      - name: Fetch game data
        run: |
          set +e
          src/Gw2Unlocks/CacheUpdater/Gw2Unlocks.CacheUpdater.Host/publish/Gw2Unlocks.CacheUpdater.Host
          code=$?
          set -e
          echo "Cache updater exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::The cache updater failed with exit code $code; no data was written."
          fi
          exit "$code"

      - name: Process the wiki
        run: |
          set +e
          dotnet run --no-launch-profile --project src/Gw2Unlocks/WikiProcessing/Gw2Unlocks.WikiProcessing.Host
          code=$?
          set -e
          echo "Wiki processing exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::Wiki processing failed with exit code $code; no graph was written."
          fi
          exit "$code"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          # Written as an if rather than the shorter `git diff --cached --quiet && exit 0`. That
          # form ends only this step, so the push below was skipped while the workflow carried on
          # to the pull request, which then failed with "Head ref must be a branch" because
          # `automated` had never reached the remote. `exit 0` is not a way to stop a workflow.
          if git diff --cached --quiet; then
            echo "No file changes to commit; the branch is still published below."
          else
            git commit -m "Cache Updater and Wiki Processing update"
          fi

          # Pushed whether or not there was anything to commit. `automated` is the head ref of the
          # pull request below and the ref the classifier checks out, so it has to exist on the
          # remote even on a night when the fetch changed nothing. A branch level with main is a
          # valid state that the next step checks for; a branch that does not exist is not.
          git push origin "HEAD:refs/heads/automated"

      # The push above fires 3_Unlock_Classifier, which is what fills in the pull request body with
      # the classification diff. This job only makes sure a request exists, and deliberately never
      # edits an existing one, so it cannot race the classifier and overwrite the diff.
      - name: Ensure a pull request exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Asked git, not the API, whether there is anything to open a request for. `gh pr create`
          # answers "No commits between main and automated" when the two refs are identical, which
          # is what a night that changed no data looks like, so the condition has to be established
          # before the call rather than by interpreting its failure.
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"

          # Checked separately from the comparison below, because `git rev-list` prints nothing both
          # when the branches match and when the argument is unknown. Treating the second as the
          # first would skip the pull request for the rest of the pipeline on a fetch failure, and
          # report success while doing it.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::Could not resolve origin/main, so the branch cannot be compared to it."
            exit 1
          fi

          if [ -z "$(git rev-list origin/main..HEAD)" ]; then
            echo "::notice::Automated branch holds nothing that main does not; no pull request needed."
            exit 0
          fi

          if PR=$(gh pr list --head automated --state open --json number --jq '.[0].number') && [ -n "$PR" ]; then
            echo "Pull request #$PR is already open; leaving its body to the classifier."
          else
            echo "Creating a placeholder pull request; the classifier fills in the diff."
            gh pr create --head automated --base main \
              --title "Data update $(TZ=Europe/Brussels date +%F)" \
              --body "The classifier is filling in this description."
          fi
