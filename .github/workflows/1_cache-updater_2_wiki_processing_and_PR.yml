name: 1_Cache_Updater_2_Wiki_Processing_and_PR

# The three things that used to be separate workflows: fetch the game data, process the wiki dump,
# and open a pull request for the result. They are three jobs here because they are one pipeline
# with nothing to decide in between, and a failure in any of them should stop the next.
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is always UTC: 03:00 UTC is 04:00 in Brussels during winter and 05:00 in summer.
    - cron: '0 3 * * *'

permissions:
  contents: write
  pull-requests: write

# One refresh at a time. Without this, a manual run during the nightly one would fight it over
# the same branch.
concurrency:
  group: automated-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `automated` holds the pending changes. It is created from main when it is missing, which is
      # the normal case after a merge, and joined when it already exists so that a night nobody had
      # time to review is not thrown away. The push names its own target, so the checkout above
      # being on main cannot make this write to main.
      #
      # It is then brought forward from main. Without this the branch is a permanent snapshot of
      # whatever main looked like when it was first created: every later fix lands on main and never
      # reaches the branch this workflow actually compiles, so the pipeline keeps silently building
      # stale code no matter how many fixes are merged. A fast-forward is the common case, because
      # once a PR is merged `automated` has nothing of its own to protect. A merge is only needed
      # while data changes are still pending review, and it fails the run rather than dropping them.
      - name: Join or create the automated branch
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/automated; then
            git checkout -B automated origin/automated
            echo "Continuing the existing automated branch."
            if git merge-base --is-ancestor origin/automated origin/main; then
              git merge --ff-only origin/main
              echo "Fast-forwarded automated to main."
            else
              git merge origin/main -m "Sync automated with main"
              echo "Merged main into automated."
            fi
          else
            git checkout -b automated origin/main
            echo "Created automated from main."
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Disabled: reported where the native SkiaSharp library went missing, then failed if it was not
      # next to the app. The two questions were deliberately separate, because the answer differs by
      # cause:
