title: "[Incorrect categorisation] Exalted unlocks"
labels: ["Incorrect categorisation"]

body:
  - type: markdown
    attributes:
      value: |
        Found an unlock or set that is categorised incorrectly on GW2Unlocks?

        Please provide as much information as possible so we can fix it quickly.

  - type: textarea
    id: unlocks
    attributes:
      label: Unlock(s) or set(s)
      description: Which unlock(s) or set(s) are incorrectly categorised?
      placeholder: |
        - Mini Exalted Sage
        - Endless Exalted Caster Tonic
    validations:
      required: true

  - type: input
    id: current-page
    attributes:
      label: Current GW2Unlocks page
      description: Which GW2Unlocks page is the unlock currently listed under?
      placeholder: https://gw2unlocks.com/other/general/
    validations:
      required: true

  - type: input
    id: correct-page
    attributes:
      label: Correct GW2Unlocks page
      description: Which GW2Unlocks page should the unlock belong to instead?
      placeholder: https://gw2unlocks.com/heart-of-thorns/auric-basin/
    validations:
      required: true

  - type: textarea
    id: wiki-links
    attributes:
      label: GW2 Wiki links
      description: Please provide link(s) to the relevant Guild Wars 2 Wiki page.
      placeholder: |
        - https://wiki.guildwars2.com/wiki/Mini_Exalted_Sage
        - https://wiki.guildwars2.com/wiki/Endless_Exalted_Caster_Tonic
    validations:
      required: true

  - type: textarea
    id: reasoning
    attributes:
      label: Reasoning
      description: Why do you think this categorisation is incorrect?
      placeholder: |
        Explain why the unlock belongs in another category and provide any additional context.
        Example: I think the Exalted are clearly linked to Auric Basin from an unlock perspective.
    validations:
      required: true