title: "[Missing unlocks] "
labels: ["Missing unlocks"]

body:
  - type: markdown
    attributes:
      value: |
        Found one or more unlocks that are missing from GW2Unlocks?

        Please provide as much information as possible so we can add them quickly.

  - type: textarea
    id: unlocks
    attributes:
      label: Missing unlock(s) or set(s)
      description: Which unlock(s) or set(s) are missing?
      placeholder: |
        - Mini Exalted Sage
        - Endless Exalted Caster Tonic
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Suggested GW2Unlocks page
      description: Which GW2Unlocks page should the unlock(s) appear under?
      placeholder: https://gw2unlocks.com/heart-of-thorns/auric-basin/
    validations:
      required: true

  - type: textarea
    id: wiki-links
    attributes:
      label: GW2 Wiki links
      description: Please provide link(s) to the relevant Guild Wars 2 Wiki page.
      placeholder: |
        - https://wiki.guildwars2.com/wiki/Mini_Exalted_Sage
        - https://wiki.guildwars2.com/wiki/Endless_Exalted_Caster_Tonic
    validations:
      required: true

  - type: textarea
    id: reasoning
    attributes:
      label: Additional information
      description: Tell us why these unlocks should be added or provide any extra context.
      placeholder: |
        Example:
        - These unlocks are obtainable in Auric Basin.
        - They are part of the Exalted theme.
        - They are currently missing from GW2Unlocks.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have searched GW2Unlocks and confirmed that these unlocks are currently missing.
          required: true